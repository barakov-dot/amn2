schema_version: 1
project: amn2
purpose: "Single source of truth for VPS runtime requirements and safe checks."

git_policy:
  store:
    - "runtime manifests"
    - "read-only check scripts"
    - "example configs with placeholders"
    - "documentation"
  never_store:
    - ".env"
    - "servers.yml"
    - "private SSH keys"
    - "Telegram bot tokens"
    - "SQLite databases"
    - "backup archives"
    - "generated client .conf files"
    - "QR images"
    - "Docker images"
    - "virtual environments"
    - "node_modules"

common:
  required_commands:
    - python3
    - git
    - ss
  optional_commands:
    - curl
    - journalctl
    - sshpass
  project_dirs:
    - data
    - logs
    - backups
    - config_templates
  default_paths:
    project_dir: /opt/amn2
    env_file: /opt/amn2/.env
    server_config: /opt/amn2/servers.yml
    database: /opt/amn2/data/amneziya.sqlite3

diagnostics:
  scripts:
    - deploy/runtime/check_vps.sh
    - deploy/runtime/collect_debug_snapshot.sh
  default_log_lines: 200
  redacted_keys:
    - TELEGRAM_BOT_TOKEN
    - APP_SECRET_KEY
    - WEB_ADMIN_PASSWORD_HASH
    - WEB_ADMIN_SESSION_SECRET
    - SMTP_PASSWORD
    - VPS_SSH_PASSWORD
    - PrivateKey
    - PresharedKey

ports:
  web_admin:
    protocol: tcp
    default: 3030
  vpn:
    protocol: udp
    default: 30001

telegram_persistent:
  activation: separate_exact_gate
  allowed_updates:
    - message
    - callback_query
  settings:
    expected_bot_username: TELEGRAM_EXPECTED_BOT_USERNAME
    admission_timeout_seconds: TELEGRAM_ADMISSION_TIMEOUT_SECONDS
    polling_timeout_seconds: TELEGRAM_POLLING_TIMEOUT_SECONDS
    runtime_lock_path: TELEGRAM_RUNTIME_LOCK_PATH

runtime_modes:
  host_systemd:
    description: "AmneziaWG runs on the VPS host and is managed by systemd."
    required_commands:
      - systemctl
      - awg
      - awg-quick
      - ss
    settings:
      service_name: "awg-quick@awg0"
      interface: "awg0"
    read_only_checks:
      - "command -v systemctl"
      - "command -v awg"
      - "command -v awg-quick"
      - "systemctl is-active awg-quick@awg0"
      - "awg show awg0"
      - "ss -lun"

  docker:
    description: "AmneziaWG runs inside a Docker container; peer changes rewrite the persistent config and restart the container."
    required_commands:
      - docker
      - ss
    settings:
      container_name: "amnezia-awg"
      interface: "awg0"
      config_path: "/opt/amnezia/awg/awg0.conf"
    read_only_checks:
      - "command -v docker"
      - "docker ps --format '{{.Names}}'"
      - "docker exec amnezia-awg awg show awg0"
      - "ss -lun"
    live_operations:
      apply-peer: "rewrite runtime.config_path inside the container, then docker restart"
      revoke-peer: "rewrite runtime.config_path inside the container, then docker restart"
      collect-traffic: "read-only docker exec awg show dump"
      sync-peers: "read-only compare remote peers with local database"
